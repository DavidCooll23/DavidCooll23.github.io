<style>
:root{--paper:#E9EFF2;--ink:#11202B;--blue:#1C6EE8;--mint:#CBEBDD;--sun:#FFC94D;--mute:#53636F;--card:#fff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin-bottom:28px}
h3{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
section{padding:64px 0}
/* top bar */
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.name{font-weight:700}
.lang{display:flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;font-weight:700;border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
/* hero */
.hero{display:grid;gap:36px;padding:28px 0 64px}
.hero p.lead{font-size:1.15rem;max-width:34ch;margin:20px 0 26px}
.gets{list-style:none;padding:0;display:grid;gap:10px;margin-bottom:28px}
.gets li{padding-left:30px;position:relative;font-weight:600}
.gets li::before{content:"";position:absolute;left:0;top:.35em;width:18px;height:18px;border-radius:50%;background:var(--blue)}
.gets li::after{content:"";position:absolute;left:6px;top:.5em;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 24px;border-radius:99px;font-weight:700;text-decoration:none;border:2px solid var(--ink)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:hover{transform:translateY(-2px)}
/* chat — the one memorable thing */
.chat{background:#fff;border-radius:28px;padding:22px 18px;display:grid;gap:10px;box-shadow:0 0 0 2px var(--ink),10px 10px 0 var(--ink);align-self:start}
.chat .top{font-size:.8rem;color:var(--mute);font-weight:600;text-align:center;padding-bottom:6px}
.b{max-width:82%;padding:10px 14px;border-radius:18px;font-size:.95rem;line-height:1.35;opacity:0;animation:pop .4s forwards}
.b.me{justify-self:end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.b.bot{background:var(--mint);border-bottom-left-radius:4px}
.b.bot b{display:block;font-size:.75rem;color:#2c6a4f}
.b:nth-child(2){animation-delay:.3s}.b:nth-child(3){animation-delay:1.1s}.b:nth-child(4){animation-delay:1.9s}.b:nth-child(5){animation-delay:2.7s}
.chat .note{font-size:.72rem;color:var(--mute);text-align:center;padding-top:4px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
/* work */
.cards{display:grid;gap:22px}
.card{background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.slot{position:relative;aspect-ratio:16/9;background:var(--ink);color:var(--paper);display:grid;place-items:center;text-align:center;font-size:.9rem}
.slot .ph{padding:12px;opacity:.85}
.slot .ph i{display:block;width:46px;height:46px;border-radius:50%;background:var(--sun);margin:0 auto 8px;position:relative}
.slot .ph i::after{content:"";position:absolute;left:18px;top:13px;border-left:15px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ink);display:none}
.slot.ok video{display:block}
.card .body{padding:20px;display:grid;gap:10px;flex:1;align-content:start}
.card p{color:var(--mute);font-size:.97rem}
.tag{justify-self:start;font-size:.8rem;font-weight:700;background:var(--sun);padding:3px 10px;border-radius:99px}
.tag.soon{background:#dde5ea;color:var(--mute)}
.demo{font-weight:700;color:var(--blue)}
/* steps */
.steps{list-style:none;padding:0;display:grid;gap:0;counter-reset:s;border-left:3px solid var(--ink);margin-left:14px}
.steps li{counter-increment:s;position:relative;padding:0 0 28px 30px}
.steps li::before{content:counter(s);position:absolute;left:-17px;top:-2px;width:31px;height:31px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.steps li:last-child{padding-bottom:0}
.steps p{color:var(--mute);max-width:56ch}
/* prices */
.prices{display:grid;gap:16px}
.price{background:var(--card);border-radius:22px;padding:24px;display:grid;gap:6px}
.price .n{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.price .n small{font-size:1rem;font-weight:600;letter-spacing:0;color:var(--mute);margin-right:6px}
.price p{color:var(--mute);font-size:.95rem}
.fine{margin-top:18px;color:var(--mute);font-size:.92rem}
/* extra blocks */
.pk{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.price .t{font-weight:700;font-size:.9rem}
.band{background:var(--sun);border-radius:28px;padding:32px 24px}
.band h2{margin-bottom:10px}.band p{max-width:52ch}
.trio{display:grid;gap:16px}
.box{background:var(--card);border-radius:22px;padding:24px;display:grid;gap:8px;align-content:start}
.box p{color:var(--mute);font-size:.97rem}
@media(min-width:760px){.trio{grid-template-columns:repeat(3,1fr)}.band{padding:44px}}
/* contacts */
.contact{background:var(--ink);color:var(--paper);border-radius:28px;padding:40px 24px;margin-bottom:40px}
.contact h2{margin-bottom:12px}
.contact p{max-width:44ch;margin-bottom:24px;opacity:.85}
.contact .btn{border-color:var(--paper)}
.contact .btn.main{border-color:var(--blue)}
footer{padding:0 0 40px;color:var(--mute);font-size:.85rem}
@media(min-width:760px){
 .hero{grid-template-columns:1.25fr 1fr;align-items:center;gap:56px}
 .cards{grid-template-columns:1fr 1fr}
 .prices{grid-template-columns:repeat(3,1fr)}
 .contact{padding:56px}
}
@media(prefers-reduced-motion:reduce){.b{animation:none;opacity:1}html{scroll-behavior:auto}.btn:hover{transform:none}}
</style>

const els=[...document.querySelectorAll('[data-i]')];
function setLang(l){
  if(!Object.hasOwn(T,l))l='sk';
  els.forEach(e=>e.textContent=T[l][e.dataset.i]);
  document.documentElement.lang=l;
  document.title=T[l].title;
  document.querySelector('meta[name=description]').content=T[l].desc;
  document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===l));
  try{localStorage.lang=l}catch(e){}
}
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setLang(b.dataset.set));
let saved='';try{saved=localStorage.lang}catch(e){}
const bl=(navigator.language||'').slice(0,2);
setLang(new URLSearchParams(location.search).get('lang')||saved||(bl=='ru'||bl=='uk'?'ru':bl=='en'?'en':'sk'));

document.querySelectorAll('.slot').forEach(s=>{
  const v=document.createElement('video');
  v.controls=true;v.preload='metadata';v.playsInline=true;v.src=s.dataset.video;
  v.onloadedmetadata=()=>{s.classList.add('ok');s.querySelector('.ph').hidden=true};
  s.appendChild(v);
});
