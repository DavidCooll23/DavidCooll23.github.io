<style>
:root{
 --bg:#f7f2ea;--paper:#fffdf9;--ink:#2b211b;--sec:#6a5c52;--line:rgba(43,33,27,.14);
 --clay:#b4553d;--clay-press:#96432f;--sand:#eadfce;
 --serif:Georgia,"Times New Roman",serif;
 --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.demo{background:var(--ink);color:#f3e9dc;font-size:.875rem;line-height:1.4;padding:9px 0}
.demo .wrap{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between}
.demo a{color:#fff;font-weight:600;text-underline-offset:3px}
header .wrap{display:flex;align-items:center;gap:20px;padding-top:20px;padding-bottom:20px}
.mark{font:italic 400 1.5rem/1 var(--serif);text-decoration:none;margin-right:auto;letter-spacing:.01em}
nav{display:flex;gap:24px}
nav a{text-decoration:none;color:var(--sec);font-size:.9375rem}
nav a:hover{color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{font:600 .8125rem/1 var(--sans);color:var(--sec);background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--sand);color:var(--ink)}
.btn{display:inline-block;background:var(--clay);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px;transition:background .2s}
.btn:hover{background:var(--clay-press)}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--sand)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-top:32px;padding-bottom:72px}
.eyebrow{font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);font-weight:600;margin-bottom:18px}
h1{font:400 clamp(2.25rem,5.2vw,3.75rem)/1.08 var(--serif);letter-spacing:-.01em;margin-bottom:20px;text-wrap:balance}
.lead{font-size:1.125rem;color:var(--sec);max-width:46ch;margin-bottom:28px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.open{font-size:.9375rem;color:var(--sec)}
.open b{color:var(--ink);font-weight:600}
.photo{position:relative}
.photo img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 20px 20px;background:var(--sand)}
.photo::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--clay);border-radius:999px 999px 20px 20px;z-index:-1;opacity:.55}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font:400 clamp(1.75rem,3.4vw,2.5rem)/1.15 var(--serif);margin-bottom:8px}
.sub{color:var(--sec);margin-bottom:32px;max-width:52ch}
.menu{list-style:none;padding:0}
.menu li{display:grid;grid-template-columns:1fr auto auto;gap:8px 28px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line)}
.menu li:first-child{border-top:1px solid var(--line)}
.menu h3{font:400 1.375rem/1.25 var(--serif)}
.menu small{display:block;font-size:.9375rem;color:var(--sec)}
.menu .eur{font:400 1.375rem/1 var(--serif);white-space:nowrap}
.menu a{font-weight:600;color:var(--clay);text-underline-offset:4px;white-space:nowrap}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;background:var(--paper);border-radius:20px;padding:28px}
.steps li::before{content:counter(s);display:block;font:italic 400 2.25rem/1 var(--serif);color:var(--clay);margin-bottom:14px}
.steps h3{font-size:1.0625rem;margin-bottom:6px}
.steps p{color:var(--sec);font-size:.9688rem}
.team{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.who{display:flex;gap:20px;align-items:center;background:var(--paper);border-radius:20px;padding:24px 28px}
.who i{flex:none;width:64px;height:64px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font:italic 400 1.75rem/1 var(--serif);color:var(--clay)}
.who h3{font:400 1.375rem/1.2 var(--serif)}
.who p{color:var(--sec);font-size:.9688rem}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.visit dl{display:grid;grid-template-columns:auto 1fr;gap:10px 24px}
.visit dt{color:var(--sec)}
.visit dd{font-weight:600}
.card{background:var(--ink);color:#f7efe4;border-radius:24px;padding:36px}
.card h3{font:400 1.75rem/1.2 var(--serif);margin-bottom:10px}
.card p{color:#d9cbbb;margin-bottom:22px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--sec);font-size:.9375rem}
footer a{color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
@media(max-width:820px){
 body{font-size:16px}
 nav{display:none}
 .hero{grid-template-columns:1fr;gap:36px;padding-top:12px;padding-bottom:56px}
 .photo{max-width:420px}
 .photo::after{inset:10px -10px -10px 10px}
 section{padding:56px 0}
 .menu li{grid-template-columns:1fr auto}
 .menu a{grid-column:1/-1}
 .steps,.team,.visit{grid-template-columns:1fr}
 .steps{gap:14px}.team{gap:14px}
 .btn{padding:14px 22px}
 .btns .btn{flex:1 1 auto;text-align:center}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>

<section><div class="wrap">

<section id="team"><div class="wrap">

  </div>
</div></section>

<section id="visit"><div class="wrap visit">

    <a class="btn" href="https://t.me/StudioBellaBookingBot" target="_blank" rel="noopener" data-i="book"></a>

</div></section>
</main>
