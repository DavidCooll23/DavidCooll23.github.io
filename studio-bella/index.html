<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Bella</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<meta property="og:title" content="Studio Bella">
<meta property="og:image" content="https://davidcooll23.github.io/studio-bella/hero.jpg">
<link rel="preload" as="image" href="hero.jpg">
<style>
:root{
 --bg:#f7f2ea;--paper:#fffdf9;--ink:#2b211b;--sec:#6a5c52;--line:rgba(43,33,27,.14);
 --clay:#b4553d;--clay-press:#96432f;--sand:#eadfce;
 --serif:Georgia,"Times New Roman",serif;
 --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.demo{background:var(--ink);color:#f3e9dc;font-size:.875rem;line-height:1.4;padding:9px 0}
.demo .wrap{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between}
.demo a{color:#fff;font-weight:600;text-underline-offset:3px}
header .wrap{display:flex;align-items:center;gap:20px;padding-top:20px;padding-bottom:20px}
.mark{font:italic 400 1.5rem/1 var(--serif);text-decoration:none;margin-right:auto;letter-spacing:.01em}
nav{display:flex;gap:24px}
nav a{text-decoration:none;color:var(--sec);font-size:.9375rem}
nav a:hover{color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{font:600 .8125rem/1 var(--sans);color:var(--sec);background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--sand);color:var(--ink)}
.btn{display:inline-block;background:var(--clay);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px;transition:background .2s}
.btn:hover{background:var(--clay-press)}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--sand)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-top:32px;padding-bottom:72px}
.eyebrow{font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);font-weight:600;margin-bottom:18px}
h1{font:400 clamp(2.25rem,5.2vw,3.75rem)/1.08 var(--serif);letter-spacing:-.01em;margin-bottom:20px;text-wrap:balance}
.lead{font-size:1.125rem;color:var(--sec);max-width:46ch;margin-bottom:28px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.open{font-size:.9375rem;color:var(--sec)}
.open b{color:var(--ink);font-weight:600}
.photo{position:relative}
.photo img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 20px 20px;background:var(--sand)}
.photo::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--clay);border-radius:999px 999px 20px 20px;z-index:-1;opacity:.55}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font:400 clamp(1.75rem,3.4vw,2.5rem)/1.15 var(--serif);margin-bottom:8px}
.sub{color:var(--sec);margin-bottom:32px;max-width:52ch}
.menu{list-style:none;padding:0}
.menu li{display:grid;grid-template-columns:1fr auto auto;gap:8px 28px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line)}
.menu li:first-child{border-top:1px solid var(--line)}
.menu h3{font:400 1.375rem/1.25 var(--serif)}
.menu small{display:block;font-size:.9375rem;color:var(--sec)}
.menu .eur{font:400 1.375rem/1 var(--serif);white-space:nowrap}
.menu a{font-weight:600;color:var(--clay);text-underline-offset:4px;white-space:nowrap}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;background:var(--paper);border-radius:20px;padding:28px}
.steps li::before{content:counter(s);display:block;font:italic 400 2.25rem/1 var(--serif);color:var(--clay);margin-bottom:14px}
.steps h3{font-size:1.0625rem;margin-bottom:6px}
.steps p{color:var(--sec);font-size:.9688rem}
.team{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.who{display:flex;gap:20px;align-items:center;background:var(--paper);border-radius:20px;padding:24px 28px}
.who i{flex:none;width:64px;height:64px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font:italic 400 1.75rem/1 var(--serif);color:var(--clay)}
.who h3{font:400 1.375rem/1.2 var(--serif)}
.who p{color:var(--sec);font-size:.9688rem}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.visit dl{display:grid;grid-template-columns:auto 1fr;gap:10px 24px}
.visit dt{color:var(--sec)}
.visit dd{font-weight:600}
.card{background:var(--ink);color:#f7efe4;border-radius:24px;padding:36px}
.card h3{font:400 1.75rem/1.2 var(--serif);margin-bottom:10px}
.card p{color:#d9cbbb;margin-bottom:22px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--sec);font-size:.9375rem}
footer a{color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
/* 2026-11-22: question form + what the owner gets */
.ask{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.q{display:grid;gap:16px;background:var(--paper);border-radius:24px;padding:32px}
.q label{display:grid;gap:6px;font-weight:600;font-size:.9375rem}
.q label small{font-weight:400;color:var(--sec)}
.q input,.q textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.q textarea{min-height:112px;resize:vertical}
.q input:focus,.q textarea:focus{outline:2px solid var(--clay);outline-offset:0;border-color:transparent}
.q .btn{border:0;cursor:pointer;font:600 1rem/1 var(--sans);justify-self:start}
.q .done{color:var(--clay);font-weight:600;font-size:.9375rem;min-height:1.5em}
.owner{display:grid;gap:14px}
.owner h3{font:400 1.375rem/1.25 var(--serif)}
.owner .note{font-size:.875rem;color:var(--sec)}
.tgm{background:#dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(43,33,27,.10)}
.tgm .top{display:flex;gap:12px;align-items:center;padding:11px 16px;background:#fff}
.tgm .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font:italic 400 1.125rem/1 var(--serif)}
.tgm .top b{display:block;font-size:.9375rem;line-height:1.2}
.tgm .top span{font-size:.8125rem;color:#708499}
.tgm .feed{padding:16px;min-height:150px;display:flex;align-items:flex-end}
.tgm .wait{width:100%;text-align:center;font-size:.875rem;color:#5d7186}
.tgm .bub{display:none;max-width:92%;background:#fff;border-radius:14px 14px 14px 4px;padding:10px 14px 8px;font-size:.9375rem;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.tgm .bub b{display:block;margin-bottom:4px}
.tgm .bub p{overflow-wrap:anywhere}
.tgm .bub span{color:#708499}
.tgm .bub small{display:block;text-align:right;font-size:.75rem;color:#8a9aa9;margin-top:2px}
.owner.got .wait{display:none}
.owner.got .bub{display:block;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.sheet{background:#fff;border:1px solid #dadce0;border-radius:14px;overflow:hidden;font:13px/1.3 Arial,Helvetica,sans-serif;color:#202124}
.sheet .t{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #dadce0;font-size:14px}
.sheet .t i{flex:none;width:16px;height:20px;border-radius:2px;background:#188038;position:relative}
.sheet .t i::after{content:"";position:absolute;left:3px;right:3px;top:7px;height:8px;border:1.5px solid #fff;border-left:0;border-right:0;box-shadow:inset 0 -3px 0 -1.5px #fff}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet th,.sheet td{border:1px solid #e3e3e3;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-weight:400}
.sheet thead th{background:#f8f9fa;color:#5f6368;text-align:center;font-size:12px;padding:3px}
.sheet .rn{width:30px;background:#f8f9fa;color:#5f6368;text-align:center;padding:6px 0}
.sheet col.d{width:23%}.sheet col.n{width:17%}.sheet col.c{width:24%}
.sheet tr.hd td{font-weight:700}
.sheet tr.new td{background:#e6f4ea;animation:rowin .6s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rowin{from{opacity:0;background:#b7e1c1}to{opacity:1}}
/* FAQ auto-reply widget */
.fab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 20px 13px 15px;font:600 .9375rem/1 var(--sans);cursor:pointer;box-shadow:0 12px 30px rgba(43,33,27,.28);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.fab svg{width:22px;height:22px}
.fab[hidden],.chat[hidden]{display:none}
.chat{position:fixed;right:20px;bottom:20px;z-index:60;width:min(390px,calc(100vw - 24px));height:min(580px,calc(100dvh - 40px));background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(43,33,27,.30);display:flex;flex-direction:column;overflow:hidden;animation:pop .3s cubic-bezier(.2,.8,.2,1);transform-origin:bottom right}
.chat .ct{display:flex;gap:12px;align-items:center;padding:14px 14px 14px 18px;background:var(--ink);color:#f7efe4}
.chat .ct .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--clay);display:grid;place-items:center;font:italic 400 1.125rem/1 var(--serif)}
.chat .ct div{flex:1;min-width:0}
.chat .ct b{display:block;font-weight:600;line-height:1.2}
.chat .ct span{font-size:.8125rem;color:#d9cbbb}
.chat .x{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:#f7efe4;font-size:1.5rem;line-height:1;cursor:pointer}
.chat .x:hover{background:rgba(255,255,255,.1)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.m{max-width:86%;padding:10px 14px;border-radius:16px;font-size:.9375rem;line-height:1.45;overflow-wrap:anywhere;animation:pop .3s ease-out}
.m.u{align-self:flex-end;background:var(--clay);color:#fff;border-bottom-right-radius:5px}
.m.b{align-self:flex-start;background:var(--sand);border-bottom-left-radius:5px}
.m .act{display:inline-block;margin-top:8px;font:600 .875rem/1 var(--sans);color:var(--clay);background:var(--paper);border:0;border-radius:999px;padding:9px 14px;text-decoration:none;cursor:pointer}
.m.dots{display:flex;gap:4px;padding:14px}
.m.dots i{width:7px;height:7px;border-radius:50%;background:var(--sec);opacity:.5;animation:blink 1s infinite}
.m.dots i:nth-child(2){animation-delay:.15s}.m.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font:inherit;font-size:.8125rem;line-height:1.2;cursor:pointer;color:var(--ink);text-align:left}
.chips button:hover{border-color:var(--clay)}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:11px 16px}
.chat input:focus{outline:2px solid var(--clay);outline-offset:0;border-color:transparent}
.chat .go{flex:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--clay);color:#fff;cursor:pointer;display:grid;place-items:center}
.chat .go svg{width:20px;height:20px}
footer{padding-bottom:96px}
@media(max-width:820px){
 body{font-size:16px}
 nav{display:none}
 .hero{grid-template-columns:1fr;gap:36px;padding-top:12px;padding-bottom:56px}
 .photo{max-width:420px}
 .photo::after{inset:10px -10px -10px 10px}
 section{padding:56px 0}
 .menu li{grid-template-columns:1fr auto}
 .menu a{grid-column:1/-1}
 .steps,.team,.visit{grid-template-columns:1fr}
 .steps{gap:14px}.team{gap:14px}
 .btn{padding:14px 22px}
 .btns .btn{flex:1 1 auto;text-align:center}
 .ask{grid-template-columns:1fr;gap:28px}
 .q{padding:24px 20px}
}
@media(max-width:520px){
 .chat{right:0;bottom:0;width:100%;height:88dvh;border-radius:22px 22px 0 0}
 .fab{right:14px;bottom:14px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}*,*::before,*::after{animation:none!important}}
</style>
</head>

const BOT='https://t.me/StudioBellaBookingBot';

  const tc=document.getElementById('tc');if(tc.dataset.none)tc.textContent=T[l].onone;

/* ---- auto-replies: keyword stems, answer in the language of the question ---- */
const fold=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’'`ʼ]/g,'');
const K={
cut:['strih','ostrih','zastrih','haircut','cut','trim','стриж','стрич','подстри','постри'],
color:['farb','color','colour','dye','highlight','melir','окрас','фарб','покрас','мелир','колор'],
nails:['manik','nail','gel','necht','маник','манік','ногт','ніг','гель'],
brows:['oboc','brow','бров'],
price:['cen','kolko','stoj','price','cost','much','how much','€','eur','скольк','скільк','цін','цен','стоит','кошту','прайс','вартіст','стоимост'],
hours:['hodin','otvor','zatvor','open','close','hour','nedel','sobot','pondel','sunday','saturday','monday','weekend','когда','коли','работа','працю','годин','час работы','воскрес','неділ','субот','выходн','вихідн','график','графік'],
addr:['adres','kde','najd','ulic','address','where','locat','find','map','адрес','адрес','где','де ви','де вас','знайти','найти','улиц','вулиц','доехать','доїхати'],
book:['rezerv','objedn','termin','volno','volny','book','appoint','slot','free','avail','запис','запиш','свобод','вільн','термин','забронир'],
cancel:['zrus','presun','storn','cancel','resched','move','change','отмен','скасу','перенес','перенос','змін'],
pay:['plat','kart','hotov','pay','card','cash','оплат','карт','налич','готівк','безнал'],
park:['park','=auto','mhd','zastav','=car','=cars','=bus','tram','парков','машин','авто','транспорт','зупин','останов'],
lang:['jazyk','po rusky','po ukraj','anglic','language','speak','english','russian','ukrain','язык','мов','говорит','розмовля','по-рус','англ'],
who:['kto','majster','kadern','who','stylist','master','кто','хто','мастер','майстр','перукар','парикмах','анна','ольга','anna','olga','olg'],
hi:['=ahoj','=dobry','=dobre','=hello','=hi','=hey','=привет','=привіт','=здравствуйте','=добрий','=добрый','=вітаю','=здрасте'],
thx:['dakuj','vdaka','thank','=thx','спасиб','дякую','благодар']};
const HOURS_RX=/do kolkej|what time|until when|до скольк|до скільк|во сколько|о котрій|о которой/;
function intents(q){
  const f=fold(q),toks=f.split(/[^\p{L}\p{N}€]+/u).filter(Boolean),hit=new Set();
  for(const k in K)for(const s of K[k]){
    const st=fold(s);
    if(st.startsWith('='))  {if(toks.includes(st.slice(1))){hit.add(k);break}}
    else if(st.includes(' ')){if(f.includes(st)){hit.add(k);break}}
    else if(toks.some(t=>t.startsWith(st))){hit.add(k);break}
  }
  if(HOURS_RX.test(f)){hit.add('hours');hit.delete('price')}
  return hit;
}
const W=a=>new Set(a.split(' '));
const UKW=W('як що чи де скільки ви вас коли працюєте є можна дякую дуже будь ласка добрий привіт'),RUW=W('как что где сколько вы вас когда работаете ли есть можно');
const SKW=W('kolko kde mate aky aka kedy ako je sa vas stoji prosim dobry ahoj otvorene'),ENW=W('how what where when do you is are the much open hi hello can');
function detect(q){
  const s=q.toLowerCase(),has=(set,str)=>str.split(/[^\p{L}]+/u).some(t=>set.has(t));
  if(/[іїєґ]/.test(s))return 'uk';
  if(/[ыэъё]/.test(s))return 'ru';
  if(/[а-я]/.test(s)){const u=has(UKW,s),r=has(RUW,s);if(u&&!r)return 'uk';if(r&&!u)return 'ru';return cur==='uk'||cur==='ru'?cur:'ru'}
  if(/[áäčďéíĺľňóôŕšťúýž]/.test(s))return 'sk';
  const f=fold(q),sk=has(SKW,f),en=has(ENW,f);
  if(sk&&!en)return 'sk';if(en&&!sk)return 'en';
  return cur==='sk'||cur==='en'?cur:'en';
}
function reply(q){
  const L=detect(q),a=A[L],h=intents(q),out=[];let btn=null;
  if(h.has('cancel'))h.delete('book');if(h.has('park'))h.delete('addr');
  const sv=['cut','color','nails','brows'].filter(k=>h.has(k));
  sv.forEach(k=>out.push(a[k]));
  if(!sv.length&&h.has('price'))out.push(a.list);
  if(!sv.length&&h.has('who'))out.push(a.who);
  ['hours','addr','pay','park','lang'].forEach(k=>{if(h.has(k))out.push(a[k])});
  if(h.has('book')){out.push(a.book);btn={t:a.bookb,href:BOT}}
  if(h.has('cancel')){out.push(a.cancel);btn={t:a.bookb,href:BOT}}
  if(!out.length&&h.has('thx'))out.push(a.thx);
  else if(!out.length&&h.has('hi'))out.push(a.hi);
  if(!out.length){out.push(a.unk);btn={t:a.unkb,form:q}}
  return {text:out.join(' '),btn,lang:L};
}
const log=$('log'),chat=$('chat'),fab=$('fab'),ci=$('ci');let greeted=false,busy=false;
function msg(cls,text,btn){
  const m=document.createElement('div');m.className='m '+cls;m.textContent=text;
  if(btn){const b=document.createElement(btn.href?'a':'button');b.className='act';b.textContent=btn.t;
    if(btn.href){b.href=btn.href;b.target='_blank';b.rel='noopener'}
    else{b.type='button';b.onclick=()=>{closeChat();fq.q.value=btn.form;$('dopyt').scrollIntoView({behavior:'smooth'});setTimeout(()=>fq.n.focus({preventScroll:true}),600)}}
    m.append(b)}
  log.append(m);log.scrollTop=log.scrollHeight;return m;
}
function botSay(text,btn){
  const d=document.createElement('div');d.className='m b dots';d.setAttribute('aria-hidden','true');d.append(document.createElement('i'),document.createElement('i'),document.createElement('i'));
  log.append(d);log.scrollTop=log.scrollHeight;busy=true;
  setTimeout(()=>{d.remove();msg('b',text,btn);busy=false},matchMedia('(prefers-reduced-motion: reduce)').matches?0:550);
}
function ask(q){q=q.trim();if(!q||busy)return;msg('u',q);const r=reply(q);botSay(r.text,r.btn);}
function openChat(){chat.hidden=false;fab.hidden=true;if(!greeted){greeted=true;botSay(T[cur].w0)}if(innerWidth>520)ci.focus({preventScroll:true})}
function closeChat(){chat.hidden=true;fab.hidden=false;fab.focus({preventScroll:true})}
fab.onclick=openChat;$('cx').onclick=closeChat;
chat.addEventListener('keydown',e=>{if(e.key==='Escape')closeChat()});
$('cf').addEventListener('submit',e=>{e.preventDefault();const v=ci.value;if(v.trim()&&!busy){ci.value='';ask(v)}});
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setLang(b.dataset.set));
let saved='';try{saved=localStorage.lang}catch(e){}
const bl=(navigator.language||'').slice(0,2);
setLang(new URLSearchParams(location.search).get('lang')||saved||(['en','ru','uk'].includes(bl)?bl:'sk'));
if(new URLSearchParams(location.search).has('chat')||location.hash==='#chat')openChat();
