let cur='sk',after=false,pcur='sk',swapT=0,first=true;
const $=id=>document.getElementById(id),pf=$('pf');
function fill(l){
  const d=P[l];
  document.querySelectorAll('[data-q]').forEach(e=>e.textContent=d[e.dataset.q]);
  document.querySelectorAll('[data-qp]').forEach(e=>e.placeholder=d[e.dataset.qp]);
  $('scr').lang=l;
}
function phone(l,flash){
  pcur=l;
  document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===l));
  /* a strip of measuring tape sweeps over the screen; the text changes while it covers it */
  if(flash&&!first&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const ph=$('phone');ph.classList.remove('go');void ph.offsetWidth;ph.classList.add('go');
    clearTimeout(swapT);swapT=setTimeout(()=>fill(pcur),300);
  }else fill(l);
  first=false;
}
function mode(a){
  after=a;document.body.classList.toggle('after',a);document.body.classList.toggle('before',!a);
  $('bBefore').setAttribute('aria-pressed',!a);$('bAfter').setAttribute('aria-pressed',a);
  $('notes').replaceChildren(...T[cur][a?'n1':'n0'].map(t=>{const li=document.createElement('li');li.textContent=t;return li}));
  pf.classList.remove('done');phone(a?cur:'sk',true);
}
$('bBefore').onclick=()=>mode(false);$('bAfter').onclick=()=>mode(true);
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pf.classList.remove('done');phone(b.dataset.p,true)});
pf.addEventListener('submit',e=>{e.preventDefault();pf.classList.add('done');pf.reset()});
/* the same client page in all four languages: tape headlines and four mini pages, built from P */
const LC={sk:'SK',uk:'UA',ru:'RU',en:'EN'};
$('tapeTrack').replaceChildren(...Object.keys(P).map(l=>{const s=document.createElement('span'),b=document.createElement('b');b.textContent=LC[l];s.append(b,P[l].h);return s}));
$('cards').replaceChildren(...Object.keys(P).map(l=>{const d=P[l],c=document.createElement('article');c.className='mini';c.lang=l;
  const el=(t,cl,tx)=>{const e=document.createElement(t);if(cl)e.className=cl;if(tx!=null)e.textContent=tx;c.append(e);return e};
  el('span','lc',LC[l]);el('h3',null,d.h);el('p',null,d.s);
  [[d.r1,'8 €'],[d.r2,'12 €']].forEach(([a,v])=>{const r=el('div','row');const s=document.createElement('span');s.textContent=a;const b=document.createElement('b');b.textContent=v;r.append(s,b)});
  el('span','fake',d.fb);return c}));
function setLang(l){
  if(!Object.hasOwn(T,l))l='sk';cur=l;try{localStorage.lang=l}catch(e){}
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T[l][e.dataset.i]??'';if(e.textContent!==v)e.textContent=v});
  document.querySelectorAll('[data-al]').forEach(e=>e.setAttribute('aria-label',T[l][e.dataset.al]));
  document.querySelectorAll('[data-back]').forEach(a=>a.href='../?lang='+l+(a.closest('.price')?'#prices':''));
  document.documentElement.lang=l;document.title=T[l].title;document.querySelector('meta[name=description]').content=T[l].desc;
  document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===l));
  mode(after);
  window.wow&&wow.resplit();
}
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setLang(b.dataset.set));
let saved='';try{saved=localStorage.lang}catch(e){}
const bl=(navigator.language||'').slice(0,2),qs=new URLSearchParams(location.search);
if(qs.get('view')==='after')after=true;
setLang(qs.get('lang')||saved||(['en','ru','uk'].includes(bl)?bl:'sk'));
