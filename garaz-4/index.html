<style>
:root{--bg:#0d0f11;--paper:#14171b;--panel:#1c2026;--ink:#eef0f2;--sec:#a3acb6;--line:rgba(238,240,242,.13);--acc:#f5c518;--acc-press:#ffd84a;--ok:#3fb56a;
--cond:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;--sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);
--cursor:#f5c518;--cursor-ink:#0d0f11;--grain:.06}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--sans);overflow-x:clip}
a{color:var(--acc)}
img{max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:.95;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.demo{background:var(--acc);color:#0d0f11;font-size:.875rem;line-height:1.4;padding:8px 0;font-weight:600}
.demo .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo a{color:#0d0f11;display:inline-flex;align-items:center;gap:8px}.demo .me{width:26px;height:26px;border-radius:50%;object-fit:cover;margin:-4px 0;flex:none}
.from{margin-top:22px;display:inline-flex;gap:10px;align-items:baseline;background:rgba(13,15,17,.72);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.9375rem}.from b{color:var(--acc);font-size:1.15rem}
.faqs .faq{max-width:820px;margin-top:28px}.faq details{border-bottom:1px solid var(--line)}.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:20px 0;font-weight:600;font-size:1.0625rem}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:"+";font-size:1.6rem;line-height:1;color:var(--acc);transition:transform .3s}.faq details[open] summary::after{transform:rotate(45deg)}.faq details p{color:var(--sec);padding:0 0 20px;max-width:60ch}
footer a{color:var(--acc)}.legal{opacity:.8}
header{position:sticky;top:0;z-index:50;background:rgba(13,15,17,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:transform .45s var(--ease)}
header.wow-up,header.is-hidden{transform:translateY(-100%)}
header .wrap{display:flex;align-items:center;gap:28px;height:66px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 1.5rem/1 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.mark i{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--acc);color:#0d0f11;font-style:normal;font-size:1.3rem}
nav{display:flex;gap:24px;margin-left:auto}
nav a{color:var(--sec);text-decoration:none;font:600 .9375rem/1 var(--cond);text-transform:uppercase;letter-spacing:.06em}
nav a:hover{color:var(--acc)}
.lang{display:flex;gap:2px}
.lang button{font:600 .8125rem/1 var(--sans);color:var(--sec);background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#0d0f11}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;font:700 1rem/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;cursor:pointer;border:0;white-space:nowrap;transition:background-color .2s var(--ease),box-shadow .2s var(--ease)}
.btn.p{background:var(--acc);color:#0d0f11}.btn.p:hover{background:var(--acc-press)}
.btn.s{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.s:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.haz{height:16px;background:repeating-linear-gradient(-45deg,var(--acc) 0 16px,var(--bg) 16px 32px)}
/* hero: workshop photo behind, giant type, the job ticket */
.hero{position:relative;padding:72px 0 88px;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg img{width:100%;height:118%;object-fit:cover;object-position:50% 40%;display:block}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,15,17,.94) 0%,rgba(13,15,17,.78) 45%,rgba(13,15,17,.45) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 30%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(2.5rem,5.6vw,7.4rem);max-width:12ch}
.lead{font-size:1.1875rem;color:#d3d8dd;max-width:40ch;margin:26px 0 30px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.open{margin-top:30px;font-size:.9375rem;color:var(--sec);display:flex;align-items:center;gap:10px}
.open b{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 rgba(63,181,106,.6);animation:pulse 2s infinite}
.open.shut b{background:#6b737c;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(63,181,106,0)}100%{box-shadow:0 0 0 0 rgba(63,181,106,0)}}
/* the job ticket = price calculator */
.ticket{background:var(--paper);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.tyre{display:block;width:100%;height:auto;background:#090a0c}
.tyre .lbl{font:600 34px var(--cond);fill:#eef0f2;letter-spacing:3px}
.tyre .small{font:500 15px var(--cond);fill:#f5c518;letter-spacing:3px}
.tk{padding:22px 26px 26px}
.tk h2{font-size:1.6rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tk h2 small{font:400 .8125rem var(--sans);color:var(--sec);text-transform:none;letter-spacing:0}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-size:.8125rem;color:var(--sec);margin-bottom:8px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;flex-direction:column;justify-content:center;min-height:46px;padding:8px 10px;border-radius:10px;background:var(--panel);cursor:pointer;font-weight:600;font-size:.9375rem;line-height:1.2;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg label:hover{background:#252a31}
.seg label small{font-weight:400;font-size:.75rem;color:var(--sec)}
.seg.rims label{align-items:center;font:700 1.2rem/1 var(--cond)}
.seg input:checked+label{background:var(--acc);color:#0d0f11}
.seg input:checked+label small{color:#3b3410}
.seg input:focus-visible+label{outline:3px solid var(--acc);outline-offset:2px}
.seg input:disabled+label{opacity:.3;cursor:default}
.chk{display:flex;gap:10px;align-items:center;font-size:.9375rem;cursor:pointer;margin:4px 0 18px}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:0}
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1.5px dashed var(--line);padding-top:16px}
.sum .tot{font:700 3.6rem/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--acc)}
.sum p{margin:0;font-size:.875rem;color:var(--sec);max-width:24ch;text-align:right}
.sum p b{display:block;color:var(--ink);font-size:1rem;font-weight:600}
.tk .btn{width:100%;margin-top:18px}
/* service marquee over the hazard band */
.mq{background:var(--acc);color:#0d0f11;padding:18px 0;border-block:2px solid #0d0f11}
.mq span{font:700 clamp(1.6rem,3.4vw,3.2rem)/1 var(--cond);text-transform:uppercase;padding:0 28px;letter-spacing:.01em}
.mq span:nth-child(even){color:transparent;-webkit-text-stroke:1.5px #0d0f11}
.mq span::after{content:"●";display:inline-block;margin-left:56px;font-size:.4em;vertical-align:middle;color:#0d0f11;-webkit-text-stroke:0}
/* sections */
section.band{padding:110px 0;position:relative}
section.band.w{background:var(--paper)}
.band h2{font-size:clamp(2.8rem,6.4vw,6.6rem)}
.sub{color:var(--sec);margin:16px 0 44px;max-width:56ch;font-size:1.0625rem}
.price{display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.price div{display:flex;justify-content:space-between;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line);align-items:baseline;transition:background-color .2s var(--ease),padding .3s var(--ease)}
.price div:hover{background:rgba(245,197,24,.06);padding-inline:14px}
.price span{font-size:1.125rem}
.price b{font:700 1.75rem/1 var(--cond);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--acc)}
/* photos */
.shots{padding:0 0 110px;background:var(--paper)}
.shots .wrap{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:20px;align-items:end}
.shots figure{margin:0;border-radius:18px;overflow:hidden;background:var(--panel)}
.shots .s1{aspect-ratio:3/2}.shots .s2{aspect-ratio:4/5}.shots .s3{aspect-ratio:4/5;margin-bottom:64px}
.shots img{display:block;width:100%;height:100%;object-fit:cover}
/* how it works: a 30-minute stopwatch fills while you scroll */
.clock .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px}
.clock-l{position:sticky;top:110px;align-self:start}
.dial{position:relative;width:min(400px,100%);aspect-ratio:1;margin-top:8px}
.dial svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.dial .tr{fill:none;stroke:var(--panel);stroke-width:14}
.dial .ar{fill:none;stroke:var(--acc);stroke-width:14;stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:553}
.dial .tk2{stroke:#3a4048;stroke-width:2}
.dial-n{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(3.4rem,7vw,6rem)/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:24px}
.steps li{counter-increment:s;background:var(--paper);border-radius:20px;padding:36px 36px 40px;min-height:46vh;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .4s var(--ease),background-color .4s var(--ease)}
.steps li::before{content:"0" counter(s);font:700 5rem/1 var(--cond);color:#2b3038;display:block;margin-bottom:auto;transition:color .4s var(--ease)}
.steps li.on{background:#1a1d22;box-shadow:inset 0 0 0 1.5px var(--acc)}
.steps li.on::before{color:var(--acc)}
.steps h3{font-size:2.1rem;margin:24px 0 10px}
.steps p{margin:0;color:var(--sec);font-size:1.0625rem;max-width:42ch}
/* order form */
.order{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start}
.order>div{min-width:0}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.days button,.slots button{flex:none;border:0;border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;font:600 .9375rem/1.2 var(--sans);transition:background-color .15s var(--ease),color .15s var(--ease)}
.days button:hover,.slots button:not(:disabled):hover{background:#262b32}
.days button{padding:12px 4px;text-align:center}
.days button small{display:block;font-weight:400;font-size:.8125rem;color:var(--sec)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slots button{min-height:46px;font-family:var(--cond);font-size:1.125rem;font-variant-numeric:tabular-nums}
.days button[aria-pressed=true],.slots button[aria-pressed=true]{background:var(--acc);color:#0d0f11}
.days button[aria-pressed=true] small{color:#3b3410}
.slots button:disabled{background:transparent;color:#5d646c;text-decoration:line-through;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.f{display:grid;gap:14px;margin-top:20px}
.f label{display:grid;gap:6px;font-size:.875rem;color:var(--sec)}
.f input{font:400 1rem var(--sans);color:var(--ink);padding:12px 14px;border:1.5px solid rgba(238,240,242,.28);border-radius:10px;background:rgba(238,240,242,.06);min-height:50px;width:100%}
.f input::placeholder{color:#7b848e}
.f input:focus{border-color:var(--acc);outline:none}
.card{background:var(--bg);border-radius:20px;padding:28px;position:sticky;top:96px;box-shadow:inset 0 0 0 1px var(--line)}
.card h3{font-size:1.6rem;margin-bottom:16px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:.9375rem}
.card dt{color:var(--sec)}
.card dd{margin:0;font-weight:600}
.card .btn{width:100%;margin-top:22px}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9375rem;color:#ff8a7a}
.ok{display:none;margin-top:16px;padding:16px;border-radius:12px;background:var(--panel);border-left:4px solid var(--ok)}
.ok.on{display:block;animation:rise .35s var(--ease)}
.ok b{display:block;font:700 1.35rem var(--cond);text-transform:uppercase;margin-bottom:4px}
.ok p{margin:0 0 8px;font-size:.9375rem}
.ok small{color:var(--sec);display:block;line-height:1.45}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* contact: the address as a giant sign */
.contact{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:end}
.addr{font:700 clamp(3rem,7.4vw,7.6rem)/.92 var(--cond);text-transform:uppercase;margin:8px 0 22px;color:var(--ink)}
.addr small{display:block;font-size:.34em;line-height:1.2;color:var(--acc);letter-spacing:.04em;margin-top:14px}
.contact h2{font-size:1.25rem;color:var(--sec);letter-spacing:.08em}
.contact .sub{margin:8px 0 0}
.cpark{color:var(--sec);max-width:44ch}
.hours{width:100%;border-collapse:collapse;font-size:1.0625rem}
.hours td{padding:16px 0;border-bottom:1px solid var(--line)}
.hours td+td{text-align:right;font:600 1.5rem var(--cond);font-variant-numeric:tabular-nums}
.hours tr.now td{color:var(--acc)}
.hours tr.now td:first-child::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:10px;vertical-align:middle}
.go{display:grid;place-items:center;width:168px;height:168px;border-radius:50%;background:var(--acc);color:#0d0f11;text-decoration:none;font:700 1.15rem/1.1 var(--cond);text-transform:uppercase;text-align:center;padding:20px;margin-top:36px;letter-spacing:.04em}
.go:hover{background:var(--acc-press)}
footer{padding:36px 0 52px;color:var(--sec);font-size:.875rem;border-top:1px solid var(--line)}
@media(max-width:900px){
  .hero .wrap,.order,.contact,.clock .wrap{grid-template-columns:1fr;gap:40px}
  .clock-l{position:static}
  .dial{width:min(260px,70vw)}
  .steps li{min-height:0}
  .steps li::before{font-size:3.4rem;margin-bottom:8px}
  .card{position:static}
  .price{grid-template-columns:1fr}
  .shots .wrap{grid-template-columns:1fr 1fr}
  .shots .s1{grid-column:1/-1}.shots .s3{margin-bottom:0}
}
@media(max-width:640px){
  nav{display:none}
  .lang{margin-left:auto}
  .wrap{padding:0 18px}
  .hero{padding:40px 0 56px}
  .hero h1{max-width:none;font-size:clamp(2.6rem,13vw,3.6rem)}
  .lead{font-size:1.0625rem}
  .acts .btn{flex:1 1 auto;padding:0 18px;font-size:.9375rem}
  section.band{padding:72px 0}
  .shots{padding-bottom:72px}
  .tk{padding:18px 16px 20px}
  .seg.rims{grid-template-columns:repeat(3,1fr);grid-auto-flow:row}
  .sum .tot{font-size:2.8rem}
  .days{grid-template-columns:repeat(3,1fr)}
  .steps li{padding:26px 22px 28px}
  .go{width:140px;height:140px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

Object.assign(T.sk,{"faqh": "Časté otázky", "q1": "Platí sa vopred?", "a1": "Nie. Platíte až po práci, kartou alebo v hotovosti.", "q2": "Je cena v cenníku konečná?", "a2": "Áno. Ak by bolo treba niečo navyše, povieme vám to ešte pred začatím.", "q3": "Čo ak nestihnem svoj termín?", "a3": "Napíšte nám. Termín vám bezplatne presunieme.", "q4": "Môžem počkať na mieste?", "a4": "Áno. Prezutie trvá okolo 30 minút, počkať môžete u nás.", "want": "Chcete taký web pre svoj podnik?", "priv": "Ochrana osobných údajov", "firm": "Ukážkové firemné údaje: Garáž 4 s. r. o., IČO 00 000 000, Dielenská 4, 821 04 Bratislava"});
Object.assign(T.uk,{"faqh": "Часті питання", "q1": "Чи треба платити наперед?", "a1": "Ні. Ви платите тільки після роботи, карткою або готівкою.", "q2": "Ціна в прайсі остаточна?", "a2": "Так. Якщо знадобиться щось додатково, ми скажемо про це ще до початку.", "q3": "Що, як я не встигну на свій час?", "a3": "Напишіть нам. Ми безкоштовно перенесемо запис.", "q4": "Можна почекати на місці?", "a4": "Так. Заміна шин триває близько 30 хвилин, почекати можна в нас.", "want": "Хочете такий сайт для свого бізнесу?", "priv": "Захист персональних даних", "firm": "Зразок реквізитів: Garáž 4 s. r. o., IČO 00 000 000, Dielenská 4, 821 04 Bratislava"});
Object.assign(T.ru,{"faqh": "Частые вопросы", "q1": "Нужно ли платить заранее?", "a1": "Нет. Вы платите только после работы, картой или наличными.", "q2": "Цена в прайсе окончательная?", "a2": "Да. Если понадобится что-то ещё, мы скажем об этом до начала работы.", "q3": "Что, если я не успеваю к своему времени?", "a3": "Напишите нам. Мы бесплатно перенесём запись.", "q4": "Можно подождать на месте?", "a4": "Да. Переобувка занимает около 30 минут, подождать можно у нас.", "want": "Хотите такой сайт для своего бизнеса?", "priv": "Защита персональных данных", "firm": "Образец реквизитов: Garáž 4 s. r. o., IČO 00 000 000, Dielenská 4, 821 04 Bratislava"});
Object.assign(T.en,{"faqh": "Frequently asked questions", "q1": "Do I pay in advance?", "a1": "No. You pay only after the work is done, by card or in cash.", "q2": "Is the listed price final?", "a2": "Yes. If anything extra is needed, we'll tell you before we start.", "q3": "What if I can't make my slot?", "a3": "Message us and we'll move your booking for free.", "q4": "Can I wait on site?", "a4": "Yes. A tyre change takes about 30 minutes, and you can wait here.", "want": "Want a website like this for your business?", "priv": "Privacy policy", "firm": "Sample company details: Garáž 4 s. r. o., IČO 00 000 000, Dielenská 4, 821 04 Bratislava"});
let cur='sk',day=null,slot=null;
const fmt=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);
const eur=n=>cur==='en'?'€'+n:n+' €';
function quote(){
  const job=calc.job.value,rim=+calc.rim.value,suv=calc.car.value==='suv',st=calc.store.checked;
  let p=job==='swap'?(suv?28:20):MOUNT[rim]+(suv?10:0);if(st)p+=25;
  const m=job==='swap'?20:(rim>=17?40:30)+(suv?10:0);
  const t=T[cur],name=(job==='swap'?t.jswap:fmt(t.jmount,{r:'R'+rim}))+(suv?t.jsuv:'')+(st?t.jstore:'');
  return {p,m,name,rim,job};
}
function paint(){
  const q=quote(),t=T[cur];
  $('tot').textContent=eur(q.p);$('tmin').textContent=fmt(t.kmin,{m:q.m});
  $('size').textContent=SIZE[q.rim];
  calc.querySelectorAll('[name=rim]').forEach(r=>r.disabled=q.job==='swap');
  $('sj').textContent=q.name;$('sp').textContent=eur(q.p);
}
calc.addEventListener('change',paint);calc.addEventListener('submit',e=>e.preventDefault());
/* opening hours: Europe/Bratislava */
function nowBA(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Bratislava',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const g=k=>p.find(x=>x.type===k).value;return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:+g('hour')*60+ +g('minute')}}
const HRS=d=>d===0?null:d===6?[480,780]:[450,1080];
const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function openState(){
  const n=nowBA(),h=HRS(n.d),t=T[cur],o=$('open');
  document.querySelectorAll('#hours tr').forEach(r=>{const [a,b]=r.dataset.d.split('-').map(Number);r.classList.toggle('now',n.d>=a&&n.d<=(b??a))});
  if(h&&n.m>=h[0]&&n.m<h[1]){o.classList.remove('shut');$('opentx').textContent=fmt(t.open,{t:hm(h[1])});return}
  o.classList.add('shut');let d=n.d,first=true;
  while(true){const hh=HRS(d);if(hh&&(!first||n.m<hh[0])){const dn=new Intl.DateTimeFormat(cur==='uk'?'uk':cur,{weekday:'long',timeZone:'Europe/Bratislava'}).format(new Date(Date.now()+((d-n.d+7)%7)*864e5));$('opentx').textContent=fmt(t.shut,{d:dn,t:hm(hh[0])});return}d=(d+1)%7;first=false}
}
/* booking: next 6 working days, slots every 40 min, some already taken */
function days(){const out=[],d=new Date();d.setHours(12,0,0,0);while(out.length<6){d.setDate(d.getDate()+1);if(d.getDay()!==0)out.push(new Date(d))}return out}
const DAYS=days();
function taken(d,i){return ((d.getDate()*7+i*13)%5)===0||((d.getDate()+i)%7)===3}
function drawDays(){
  const L=cur==='uk'?'uk':cur,wd=new Intl.DateTimeFormat(L,{weekday:'short'}),dm=new Intl.DateTimeFormat(L,{day:'numeric',month:'numeric'});
  $('days').replaceChildren(...DAYS.map((d,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',day===i);
    b.append(wd.format(d));const s=document.createElement('small');s.textContent=dm.format(d);b.append(s);
    b.onclick=()=>{day=i;slot=null;drawDays();drawSlots();summary()};return b}));
}
function drawSlots(){
  const box=$('slots');if(day===null){box.replaceChildren();return}
  const d=DAYS[day],h=HRS(d.getDay()),list=[];for(let m=h[0];m+30<=h[1];m+=40)list.push(m);
  box.replaceChildren(...list.map((m,i)=>{const b=document.createElement('button');b.type='button';b.textContent=hm(m);
    if(taken(d,i)){b.disabled=true}else{b.setAttribute('aria-pressed',slot===m);b.onclick=()=>{slot=m;drawSlots();summary()}}return b}));
}
function when(){if(day===null||slot===null)return null;const L=cur==='uk'?'uk':cur;return new Intl.DateTimeFormat(L,{weekday:'long',day:'numeric',month:'numeric'}).format(DAYS[day])+', '+hm(slot)}
function summary(){$('sw').textContent=when()||'—';$('omsg').textContent=''}
of.addEventListener('submit',e=>{
  e.preventDefault();const n=of.n.value.trim(),tel=of.t.value.trim(),w=when();
  if(!w||!n||!tel){$('omsg').textContent=T[cur].oneed;if(w)(n?of.t:of.n).focus();$('ok').classList.remove('on');return}
  $('omsg').textContent='';$('oktx').textContent=fmt(T[cur].oktx,{n,w,p:eur(quote().p)});
  const ok=$('ok');ok.classList.remove('on');void ok.offsetWidth;ok.classList.add('on');
});
/* language */
function setLang(l){
  if(!Object.hasOwn(T,l))l='sk';cur=l;try{localStorage.lang=l}catch(e){}
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T[l][e.dataset.i]??'';if(e.textContent!==v)e.textContent=v});
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
  document.querySelectorAll('[data-back]').forEach(a=>a.href='../?lang='+l);
  document.documentElement.lang=l;document.title=T[l].title;document.querySelector('meta[name=description]').content=T[l].desc;
  document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===l));
  paint();openState();drawDays();drawSlots();summary();
  if($('ok').classList.contains('on')){$('ok').classList.remove('on')}
  window.wow&&wow.resplit();
}
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setLang(b.dataset.set));
let saved='';try{saved=localStorage.lang}catch(e){}
const bl=(navigator.language||'').slice(0,2);
setLang(new URLSearchParams(location.search).get('lang')||saved||(['en','ru','uk'].includes(bl)?bl:'sk'));
/* stopwatch ticks (static) */
(()=>{const g=$('ticks'),ns='http://www.w3.org/2000/svg';for(let i=0;i<30;i++){const a=i/30*Math.PI*2,r1=i%5?78:72,l=document.createElementNS(ns,'line');l.setAttribute('class','tk2');l.setAttribute('x1',100+Math.cos(a)*r1);l.setAttribute('y1',100+Math.sin(a)*r1);l.setAttribute('x2',100+Math.cos(a)*82);l.setAttribute('y2',100+Math.sin(a)*82);g.append(l)}})();
/* motion: the tyre turns with the scroll and spins when the rim changes; the stopwatch fills 0 -> 30 min over "how it works" */
addEventListener('DOMContentLoaded',()=>{
  const arc=$('arc30'),mins=$('mins'),steps=[...document.querySelectorAll('#steps li')],C=553;
  const clock=p=>{arc.style.strokeDashoffset=C*(1-p);const s=Math.round(p*1800);mins.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    steps.forEach((li,i)=>li.classList.toggle('on',p>=i/3-.001&&(p<(i+1)/3||i===2)))};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!window.gsap||!window.ScrollTrigger){clock(1);return}
  gsap.registerPlugin(ScrollTrigger);
  const tyre=$('tyreg');
  gsap.set(tyre,{svgOrigin:'280 290'});
  gsap.to(tyre,{rotation:-120,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:.6}});
  calc.addEventListener('change',e=>{if(e.target.name!=='rim'&&e.target.name!=='job')return;
    gsap.fromTo('#size',{opacity:0},{opacity:1,duration:.5});
    gsap.fromTo(tyre.querySelector('circle:nth-child(5)'),{attr:{'stroke-dasharray':'0 900'}},{attr:{'stroke-dasharray':'40 900'},duration:.6})});
  clock(0);
  ScrollTrigger.create({trigger:'#steps',start:'top 70%',end:'bottom 70%',scrub:.4,onUpdate:s=>clock(s.progress)});
});
</script>
