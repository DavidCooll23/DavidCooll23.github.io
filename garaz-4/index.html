<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garáž 4</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2328">
<style>
:root{--bg:#eceeed;--paper:#fafbfa;--ink:#1f2328;--sec:#545c66;--line:rgba(31,35,40,.13);--blue:#1f4fa3;--blue-press:#183f84;--blue-soft:#e3eaf6;--amber:#f2c230;
--cond:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;--sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--sans)}
a{color:var(--blue)}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.05;margin:0;letter-spacing:0}
.demo{background:var(--ink);color:#e4e7ea;font-size:.875rem;line-height:1.4;padding:9px 0}
.demo .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo a{color:#fff}
header{background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:24px;height:64px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 1.375rem/1 var(--cond)}
.mark i{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--amber);font-style:normal;font-size:1.25rem}
nav{display:flex;gap:20px;margin-left:auto}
nav a{color:var(--sec);text-decoration:none;font-size:.9375rem}
nav a:hover{color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{font:600 .8125rem/1 var(--sans);color:var(--sec);background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;font:600 1rem/1 var(--sans);text-decoration:none;cursor:pointer;border:0;transition:background-color .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-press)}
.btn.s{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.s:hover{background:rgba(31,35,40,.05)}
/* hero */
.hero{padding:56px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.5rem,5.4vw,4.25rem);max-width:12ch}
.lead{font-size:1.1875rem;color:var(--sec);max-width:36ch;margin:20px 0 28px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.open{margin-top:28px;font-size:.9375rem;color:var(--sec);display:flex;align-items:center;gap:8px}
.open b{width:8px;height:8px;border-radius:50%;background:#2f8f4e;flex:none}
.open.shut b{background:#a8adb3}
/* the job ticket = price calculator */
.ticket{background:var(--paper);border-radius:16px;box-shadow:0 1px 2px rgba(31,35,40,.08),0 12px 32px rgba(31,35,40,.10);overflow:hidden}
.tyre{display:block;width:100%;height:auto;background:var(--ink)}
.tyre .lbl{font:600 34px var(--cond);fill:#eef0f2;letter-spacing:3px}
.tyre .small{font:500 15px var(--cond);fill:#8b939c;letter-spacing:2px}
.tk{padding:20px 24px 24px}
.tk h2{font-size:1.5rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tk h2 small{font:400 .8125rem var(--sans);color:var(--sec)}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-size:.8125rem;color:var(--sec);margin-bottom:8px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:8px 10px;border-radius:8px;background:var(--bg);cursor:pointer;font-weight:600;font-size:.9375rem;line-height:1.2;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg label small{font-weight:400;font-size:.75rem;color:var(--sec)}
.seg.rims label{align-items:center;font:600 1.125rem/1 var(--cond)}
.seg input:checked+label{background:var(--ink);color:#fff}
.seg input:checked+label small{color:#c4c9ce}
.seg input:focus-visible+label{outline:3px solid var(--blue);outline-offset:2px}
.seg input:disabled+label{opacity:.35;cursor:default}
.chk{display:flex;gap:10px;align-items:center;font-size:.9375rem;cursor:pointer;margin:4px 0 18px}
.chk input{width:20px;height:20px;accent-color:var(--blue);margin:0}
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1.5px dashed var(--line);padding-top:16px}
.sum .tot{font:600 3rem/1 var(--cond);font-variant-numeric:tabular-nums}
.sum p{margin:0;font-size:.875rem;color:var(--sec);max-width:24ch;text-align:right}
.sum p b{display:block;color:var(--ink);font-size:1rem;font-weight:600}
.tk .btn{width:100%;margin-top:18px}
/* sections */
section.band{padding:72px 0;border-top:1px solid var(--line)}
section.band.w{background:var(--paper)}
.band h2{font-size:clamp(2rem,3.6vw,2.75rem)}
.sub{color:var(--sec);margin:10px 0 32px;max-width:56ch}
.price{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.price div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.price span{font-size:1.0625rem}
.price span small{display:block;color:var(--sec);font-size:.875rem}
.price b{font:600 1.375rem/1 var(--cond);white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:16px}
.steps li::before{content:counter(s);font:600 2.5rem/1 var(--cond);color:var(--blue);display:block;margin-bottom:12px}
.steps h3{font-size:1.375rem;margin-bottom:8px}
.steps p{margin:0;color:var(--sec)}
/* order form */
.order{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}
.order>div{min-width:0}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.days button,.slots button{flex:none;border:0;border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;font:600 .9375rem/1.2 var(--sans);transition:background-color .15s var(--ease),color .15s var(--ease)}
.days button{padding:10px 4px;text-align:center}
.days button small{display:block;font-weight:400;font-size:.8125rem;color:var(--sec)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slots button{min-height:44px;font-family:var(--cond);font-size:1.0625rem;font-variant-numeric:tabular-nums}
.days button[aria-pressed=true],.slots button[aria-pressed=true]{background:var(--ink);color:#fff}
.days button[aria-pressed=true] small{color:#c4c9ce}
.slots button:disabled{background:transparent;color:#9aa1a8;text-decoration:line-through;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.f{display:grid;gap:14px;margin-top:20px}
.f label{display:grid;gap:6px;font-size:.875rem;color:var(--sec)}
.f input{font:400 1rem var(--sans);color:var(--ink);padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px;width:100%}
.f input:focus{border-color:var(--blue);outline:none}
.card{background:var(--bg);border-radius:16px;padding:24px;position:sticky;top:24px}
.card h3{font-size:1.25rem;margin-bottom:14px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9375rem}
.card dt{color:var(--sec)}
.card dd{margin:0;font-weight:600}
.card .btn{width:100%;margin-top:20px}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9375rem;color:#9b2c1f}
.ok{display:none;margin-top:16px;padding:16px;border-radius:12px;background:#fff;border-left:4px solid #2f8f4e}
.ok.on{display:block;animation:rise .35s var(--ease)}
.ok b{display:block;font:600 1.25rem var(--cond);margin-bottom:4px}
.ok p{margin:0 0 8px;font-size:.9375rem}
.ok small{color:var(--sec);display:block;line-height:1.45}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.addr{font:600 1.75rem/1.2 var(--cond);margin:0 0 12px}
.hours{width:100%;border-collapse:collapse;font-size:1rem}
.hours td{padding:12px 0;border-bottom:1px solid var(--line)}
.hours td+td{text-align:right;font-family:var(--cond);font-size:1.125rem;font-variant-numeric:tabular-nums}
.hours tr.now td{font-weight:600}
.hours tr.now td:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:middle}
footer{padding:32px 0 48px;color:var(--sec);font-size:.875rem;border-top:1px solid var(--line)}
@media(max-width:900px){
  .hero .wrap,.order,.contact{grid-template-columns:1fr;gap:36px}
  .card{position:static}
  .price{grid-template-columns:1fr}
}
@media(max-width:640px){
  nav{display:none}
  .lang{margin-left:auto}
  .wrap{padding:0 18px}
  .hero{padding:36px 0 48px}
  .lead{font-size:1.0625rem}
  .acts .btn{flex:1}
  .steps{grid-template-columns:1fr;gap:24px}
  section.band{padding:52px 0}
  .tk{padding:18px 16px 20px}
  .seg.rims{grid-template-columns:repeat(3,1fr);grid-auto-flow:row}
  .sum .tot{font-size:2.5rem}
  .days{grid-template-columns:repeat(3,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="demo"><div class="wrap"><span data-i="demo"></span><a data-back href="../" data-i="back"></a></div></div>
<header><div class="wrap">
  <a class="mark" href="#top"><i aria-hidden="true">4</i>Garáž 4</a>
  <nav><a href="#cennik" data-i="n1"></a><a href="#objednat" data-i="n2"></a><a href="#kontakt" data-i="n3"></a></nav>

  </div>
</div></header>
<main id="top">
<section class="hero"><div class="wrap">
  <div>

    <p class="lead" data-i="lead"></p>
    <div class="acts"><a class="btn p" href="#objednat" data-i="b1"></a><a class="btn s" href="#cennik" data-i="b2"></a></div>

        <input type="radio" name="job" id="j2" value="swap"><label for="j2"><span data-i="kj2"></span><small data-i="kj2s"></small></label>

        <input type="radio" name="rim" id="r18" value="18"><label for="r18">R18</label>

      <label class="chk"><input type="checkbox" name="store" id="store"><span data-i="kst"></span></label>
      <div class="sum"><div class="tot" id="tot" aria-live="polite">36 €</div><p><b id="tmin"></b><span data-i="kinc"></span></p></div>
      <a class="btn p" href="#objednat" data-i="kgo"></a>
    </div>
  </form>
</div></section>

<section class="band w" id="cennik"><div class="wrap">
  <h2 data-i="ph"></h2><p class="sub" data-i="ps"></p>
  <div class="price">
    <div><span data-i="p1"></span><b data-i="p1v"></b></div>
    <div><span data-i="p2"></span><b data-i="p2v"></b></div>
    <div><span data-i="p3"></span><b data-i="p3v"></b></div>
    <div><span data-i="p4"></span><b data-i="p4v"></b></div>
    <div><span data-i="p5"></span><b data-i="p5v"></b></div>
    <div><span data-i="p6"></span><b data-i="p6v"></b></div>
    <div><span data-i="p7"></span><b data-i="p7v"></b></div>
    <div><span data-i="p8"></span><b data-i="p8v"></b></div>
  </div>
</div></section>

<section class="band"><div class="wrap">
  <h2 data-i="sh"></h2><p class="sub" data-i="ss"></p>
  <ol class="steps">
    <li><h3 data-i="s1t"></h3><p data-i="s1p"></p></li>
    <li><h3 data-i="s2t"></h3><p data-i="s2p"></p></li>
    <li><h3 data-i="s3t"></h3><p data-i="s3p"></p></li>
  </ol>
</div></section>

<section class="band w" id="objednat"><div class="wrap">
  <h2 data-i="oh"></h2><p class="sub" data-i="os"></p>
  <form class="order" id="of" novalidate>
    <div>
      <fieldset><legend data-i="oday"></legend><div class="days" id="days"></div></fieldset>
      <fieldset><legend data-i="otime"></legend><div class="slots" id="slots"></div></fieldset>
      <div class="f">
        <label><span data-i="oname"></span><input name="n" autocomplete="name" data-ph="pn" required></label>
        <label><span data-i="otel"></span><input name="t" type="tel" autocomplete="tel" data-ph="pt" required></label>
        <label><span data-i="ocar"></span><input name="c" data-ph="pc"></label>
      </div>
    </div>
    <div class="card">
      <h3 data-i="osum"></h3>
      <dl><dt data-i="ojob"></dt><dd id="sj"></dd><dt data-i="oprice"></dt><dd id="sp"></dd><dt data-i="owhen"></dt><dd id="sw">—</dd></dl>
      <button class="btn p" type="submit" data-i="obtn"></button>
      <p class="msg" id="omsg" aria-live="polite"></p>
      <div class="ok" id="ok" role="status"><b data-i="okt"></b><p id="oktx"></p><small data-i="onote"></small></div>
    </div>
  </form>
</div></section>

<section class="band" id="kontakt"><div class="wrap contact">
  <div><h2 data-i="ch"></h2><p class="sub" data-i="cs"></p><p class="addr">Dielenská 4<br>821 04 Bratislava-Ružinov</p><p data-i="cpark"></p></div>
  <table class="hours" id="hours"><tbody>
    <tr data-d="1-5"><td data-i="d1"></td><td>7:30–18:00</td></tr>
    <tr data-d="6"><td data-i="d2"></td><td>8:00–13:00</td></tr>
    <tr data-d="0"><td data-i="d3"></td><td data-i="closed"></td></tr>
  </tbody></table>
</div></section>
</main>
<footer><div class="wrap"><span data-i="foot"></span> <a data-back href="../" data-i="back"></a><br>© 2026 Davyd Konstantinov</div></footer>

const SIZE={14:"175/65 R14 82T",15:"195/65 R15 91H",16:"205/55 R16 91V",17:"225/45 R17 94W",18:"235/40 R18 95Y",19:"245/35 R19 93Y"};
const MOUNT={14:30,15:32,16:36,17:40,18:46,19:52};
const $=id=>document.getElementById(id),calc=$('calc'),of=$('of');
let cur='sk',day=null,slot=null;
const fmt=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);
const eur=n=>cur==='en'?'€'+n:n+' €';
function quote(){
  const job=calc.job.value,rim=+calc.rim.value,suv=calc.car.value==='suv',st=calc.store.checked;
  let p=job==='swap'?(suv?28:20):MOUNT[rim]+(suv?10:0);if(st)p+=25;
  const m=job==='swap'?20:(rim>=17?40:30)+(suv?10:0);
  const t=T[cur],name=(job==='swap'?t.jswap:fmt(t.jmount,{r:'R'+rim}))+(suv?t.jsuv:'')+(st?t.jstore:'');
  return {p,m,name,rim,job};
}
function paint(){
  const q=quote(),t=T[cur];
  $('tot').textContent=eur(q.p);$('tmin').textContent=fmt(t.kmin,{m:q.m});
  $('size').textContent=SIZE[q.rim];
  calc.querySelectorAll('[name=rim]').forEach(r=>r.disabled=q.job==='swap');
  $('sj').textContent=q.name;$('sp').textContent=eur(q.p);
}
calc.addEventListener('change',paint);calc.addEventListener('submit',e=>e.preventDefault());
/* opening hours: Europe/Bratislava */
function nowBA(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Bratislava',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const g=k=>p.find(x=>x.type===k).value;return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:+g('hour')*60+ +g('minute')}}
const HRS=d=>d===0?null:d===6?[480,780]:[450,1080];
const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function openState(){
  const n=nowBA(),h=HRS(n.d),t=T[cur],o=$('open');
  document.querySelectorAll('#hours tr').forEach(r=>{const [a,b]=r.dataset.d.split('-').map(Number);r.classList.toggle('now',n.d>=a&&n.d<=(b??a))});
  if(h&&n.m>=h[0]&&n.m<h[1]){o.classList.remove('shut');$('opentx').textContent=fmt(t.open,{t:hm(h[1])});return}
  o.classList.add('shut');let d=n.d,first=true;
  while(true){const hh=HRS(d);if(hh&&(!first||n.m<hh[0])){const dn=new Intl.DateTimeFormat(cur==='uk'?'uk':cur,{weekday:'long',timeZone:'Europe/Bratislava'}).format(new Date(Date.now()+((d-n.d+7)%7)*864e5));$('opentx').textContent=fmt(t.shut,{d:dn,t:hm(hh[0])});return}d=(d+1)%7;first=false}
}
/* booking: next 6 working days, slots every 40 min, some already taken */
function days(){const out=[],d=new Date();d.setHours(12,0,0,0);while(out.length<6){d.setDate(d.getDate()+1);if(d.getDay()!==0)out.push(new Date(d))}return out}
const DAYS=days();
function taken(d,i){return ((d.getDate()*7+i*13)%5)===0||((d.getDate()+i)%7)===3}
function drawDays(){
  const L=cur==='uk'?'uk':cur,wd=new Intl.DateTimeFormat(L,{weekday:'short'}),dm=new Intl.DateTimeFormat(L,{day:'numeric',month:'numeric'});
  $('days').replaceChildren(...DAYS.map((d,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',day===i);
    b.append(wd.format(d));const s=document.createElement('small');s.textContent=dm.format(d);b.append(s);
    b.onclick=()=>{day=i;slot=null;drawDays();drawSlots();summary()};return b}));
}
function drawSlots(){
  const box=$('slots');if(day===null){box.replaceChildren();return}
  const d=DAYS[day],h=HRS(d.getDay()),list=[];for(let m=h[0];m+30<=h[1];m+=40)list.push(m);
  box.replaceChildren(...list.map((m,i)=>{const b=document.createElement('button');b.type='button';b.textContent=hm(m);
    if(taken(d,i)){b.disabled=true}else{b.setAttribute('aria-pressed',slot===m);b.onclick=()=>{slot=m;drawSlots();summary()}}return b}));
}
function when(){if(day===null||slot===null)return null;const L=cur==='uk'?'uk':cur;return new Intl.DateTimeFormat(L,{weekday:'long',day:'numeric',month:'numeric'}).format(DAYS[day])+', '+hm(slot)}
function summary(){$('sw').textContent=when()||'—';$('omsg').textContent=''}
of.addEventListener('submit',e=>{
  e.preventDefault();const n=of.n.value.trim(),tel=of.t.value.trim(),w=when();
  if(!w||!n||!tel){$('omsg').textContent=T[cur].oneed;if(w)(n?of.t:of.n).focus();$('ok').classList.remove('on');return}
  $('omsg').textContent='';$('oktx').textContent=fmt(T[cur].oktx,{n,w,p:eur(quote().p)});
  const ok=$('ok');ok.classList.remove('on');void ok.offsetWidth;ok.classList.add('on');
});
/* language */
const els=[...document.querySelectorAll('[data-i]')];
function setLang(l){
  if(!Object.hasOwn(T,l))l='sk';cur=l;try{localStorage.lang=l}catch(e){}
  els.forEach(e=>e.textContent=T[l][e.dataset.i]??'');
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
  document.querySelectorAll('[data-back]').forEach(a=>a.href='../?lang='+l);
  document.documentElement.lang=l;document.title=T[l].title;document.querySelector('meta[name=description]').content=T[l].desc;
  document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===l));
  paint();openState();drawDays();drawSlots();summary();
  if($('ok').classList.contains('on')){$('ok').classList.remove('on')}
}
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setLang(b.dataset.set));
let saved='';try{saved=localStorage.lang}catch(e){}
const bl=(navigator.language||'').slice(0,2);
setLang(new URLSearchParams(location.search).get('lang')||saved||(['en','ru','uk'].includes(bl)?bl:'sk'));
</script>
